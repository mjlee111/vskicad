# Publishes to the Visual Studio Marketplace when a GitHub release is published.
# Auth: Marketplace Trusted Publishing (OIDC). Requires a policy on publisher
# mjlee111 for repo mjlee111/vskicad, workflow file publish.yml.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # vsce >= 4 (needed for --oidc) requires Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check release tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck

      # test:core is not run here: it needs a local KiCad 10.x install and demo projects.
      - run: npm run package

      - name: Publish
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "vskicad-${{ steps.version.outputs.version }}.vsix"
